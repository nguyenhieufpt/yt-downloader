<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>YouTube Downloader (MP4 / MP3)</title>
  <style>
    :root {
      --bg: #f4f6f8;
      --card: #ffffff;
      --border: #d0d7de;
      --text: #1f2328;
      --muted: #656d76;
      --primary: #1f883d;
      --primary-hover: #1a7f37;
      --danger: #cf222e;
      --danger-hover: #a40e26;
      --accent: #0969da;
      --warn: #9a6700;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 24px 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    .container {
      max-width: 820px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    h1 {
      margin: 0;
      font-size: 22px;
      font-weight: 700;
    }
    .subtitle {
      margin: 4px 0 0;
      color: var(--muted);
      font-size: 13px;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 16px;
    }
    .card-title {
      font-size: 14px;
      font-weight: 600;
      margin: 0 0 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }
    .row {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }
    input[type="text"], select {
      padding: 8px 10px;
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 14px;
      background: #fff;
      color: var(--text);
    }
    input[type="text"]:focus, select:focus {
      outline: 2px solid rgba(9, 105, 218, 0.25);
      border-color: var(--accent);
    }
    .grow { flex: 1; min-width: 220px; }
    button {
      padding: 8px 14px;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: #f6f8fa;
      color: var(--text);
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
    }
    button:hover:not(:disabled) { background: #eaeef2; }
    button:disabled { opacity: 0.55; cursor: not-allowed; }
    .btn-primary {
      background: var(--primary);
      border-color: var(--primary);
      color: #fff;
      font-weight: 600;
      min-width: 110px;
    }
    .btn-primary:hover:not(:disabled) { background: var(--primary-hover); }
    .btn-danger {
      background: var(--danger);
      border-color: var(--danger);
      color: #fff;
      font-weight: 600;
      min-width: 100px;
    }
    .btn-danger:hover:not(:disabled) { background: var(--danger-hover); }
    .btn-plus {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
      font-weight: 700;
      padding: 6px 12px;
    }
    .btn-plus:hover:not(:disabled) { background: #0550ae; }
    .btn-icon {
      padding: 6px 10px;
      min-width: 34px;
    }
    .status-note {
      margin-top: 8px;
      font-size: 13px;
      color: var(--muted);
    }
    .status-ok { color: var(--primary); }
    .status-warn { color: var(--warn); }
    .status-err { color: var(--danger); }
    .options-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
      align-items: center;
    }
    .option-block {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      padding: 8px 10px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: #fafbfc;
    }
    .links-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .link-item {
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px;
      background: #fafbfc;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .idx-badge {
      font-size: 13px;
      font-weight: 600;
      color: var(--muted);
      min-width: 24px;
    }
    .progress-wrap {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .progress-track {
      flex: 1;
      height: 16px;
      background: #eaeef2;
      border-radius: 999px;
      overflow: hidden;
      position: relative;
    }
    .progress-fill {
      height: 100%;
      width: 0%;
      background: var(--accent);
      transition: width 0.2s ease;
    }
    .progress-fill.done { background: var(--primary); }
    .progress-fill.cancelled { background: var(--warn); }
    .progress-fill.error { background: var(--danger); }
    .progress-pct {
      font-size: 12px;
      font-weight: 600;
      min-width: 38px;
      text-align: right;
    }
    .progress-status {
      font-size: 12px;
      color: var(--muted);
      min-width: 190px;
      max-width: 280px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .controls {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }
    .file-list {
      list-style: none;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      gap: 6px;
      max-height: 220px;
      overflow-y: auto;
    }
    .file-list li {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      padding: 6px 8px;
      border-radius: 6px;
      background: #fafbfc;
      border: 1px solid #eaeef2;
      font-size: 13px;
    }
    .file-list a {
      color: var(--accent);
      text-decoration: none;
      word-break: break-all;
    }
    .file-list a:hover { text-decoration: underline; }
    .file-size {
      color: var(--muted);
      font-size: 12px;
      white-space: nowrap;
    }
  </style>
</head>
<body>
  <div class="container">
    <div>
      <h1>YouTube Downloader</h1>
      <p class="subtitle">Tải Video (MP4) hoặc Convert sang MP3 — file tự lưu vào thư mục <code>downloads/</code></p>
    </div>

    <!-- 1. Cookie -->
    <div class="card">
      <div class="card-title">1. Cookie Chrome (cookies.txt)</div>
      <div class="row">
        <input type="file" id="cookieFileInput" accept=".txt" hidden />
        <button id="chooseCookieBtn" type="button">Chọn Cookie...</button>
        <button id="clearCookieBtn" type="button">Xóa</button>
        <span id="cookieStatus" class="status-note" style="margin-top:0;">Đang kiểm tra...</span>
      </div>
    </div>

    <!-- 2. Options -->
    <div class="card">
      <div class="card-title">2. Tùy chọn định dạng</div>
      <div class="options-grid">
        <div class="option-block">
          <label>
            <input type="radio" name="mode" value="mp3" checked />
            <strong>Convert sang MP3</strong>
          </label>
          <select id="bitrateSelect">
            <option value="128">128 kbps</option>
            <option value="192" selected>192 kbps</option>
            <option value="256">256 kbps</option>
            <option value="320">320 kbps</option>
          </select>
          <label style="font-size:13px;">
            <input type="checkbox" id="thumbCheckbox" />
            Nhúng ảnh bìa
          </label>
        </div>

        <div class="option-block">
          <label>
            <input type="radio" name="mode" value="mp4" />
            <strong>Giữ nguyên Video (MP4)</strong>
          </label>
          <select id="qualitySelect" disabled>
            <option value="1080" selected>Tối đa 1080p</option>
            <option value="720">Tối đa 720p</option>
            <option value="480">Tối đa 480p</option>
            <option value="360">Tối đa 360p</option>
            <option value="best">Cao nhất (Best)</option>
          </select>
        </div>
      </div>
    </div>

    <!-- 3. Links -->
    <div class="card">
      <div class="card-title">
        <span>3. Link YouTube</span>
        <button id="addRowBtn" class="btn-plus" type="button" title="Thêm ô nhập link">+ Thêm ô</button>
      </div>
      <div id="linksList" class="links-list"></div>
    </div>

    <!-- 4. Controls -->
    <div class="card">
      <div class="controls">
        <span id="summaryText" class="status-note" style="margin-top:0;">Sẵn sàng</span>
        <div class="row">
          <button id="startBtn" class="btn-primary" type="button">Start</button>
          <button id="stopBtn" class="btn-danger" type="button" disabled>Dừng</button>
        </div>
      </div>
    </div>

    <!-- 5. Downloads list -->
    <div class="card">
      <div class="card-title">
        <span>File đã tải (<code>./downloads</code>)</span>
        <button id="refreshFilesBtn" type="button">Làm mới</button>
      </div>
      <ul id="filesList" class="file-list">
        <li style="color:var(--muted);">Chưa có file nào.</li>
      </ul>
    </div>
  </div>

  <script>
    const cookieFileInput = document.getElementById("cookieFileInput");
    const chooseCookieBtn = document.getElementById("chooseCookieBtn");
    const clearCookieBtn = document.getElementById("clearCookieBtn");
    const cookieStatus = document.getElementById("cookieStatus");

    const modeRadios = document.querySelectorAll('input[name="mode"]');
    const bitrateSelect = document.getElementById("bitrateSelect");
    const thumbCheckbox = document.getElementById("thumbCheckbox");
    const qualitySelect = document.getElementById("qualitySelect");

    const linksList = document.getElementById("linksList");
    const addRowBtn = document.getElementById("addRowBtn");
    const startBtn = document.getElementById("startBtn");
    const stopBtn = document.getElementById("stopBtn");
    const summaryText = document.getElementById("summaryText");
    const filesList = document.getElementById("filesList");
    const refreshFilesBtn = document.getElementById("refreshFilesBtn");

    let rowSeq = 0;
    let rows = [];
    let isRunning = false;
    let pollTimer = null;

    function syncOptionControls() {
      const mode = document.querySelector('input[name="mode"]:checked').value;
      const isMp3 = mode === "mp3";
      bitrateSelect.disabled = isRunning || !isMp3;
      thumbCheckbox.disabled = isRunning || !isMp3;
      qualitySelect.disabled = isRunning || isMp3;
    }

    modeRadios.forEach((r) => r.addEventListener("change", syncOptionControls));

    function renderCookieStatus(data) {
      cookieStatus.textContent = data.message || "";
      cookieStatus.className = "status-note";
      if (data.has_cookie) {
        cookieStatus.classList.add(data.valid ? "status-ok" : "status-warn");
      }
      clearCookieBtn.disabled = isRunning || !data.has_cookie;
    }

    async function fetchCookieStatus() {
      const res = await fetch("/api/cookie");
      renderCookieStatus(await res.json());
    }

    chooseCookieBtn.addEventListener("click", () => cookieFileInput.click());

    cookieFileInput.addEventListener("change", async () => {
      const file = cookieFileInput.files[0];
      if (!file) return;
      const formData = new FormData();
      formData.append("file", file);
      const res = await fetch("/api/cookie", { method: "POST", body: formData });
      const data = await res.json();
      if (!res.ok) {
        alert(data.detail || "Không upload được file cookie.");
        return;
      }
      renderCookieStatus(data);
      cookieFileInput.value = "";
    });

    clearCookieBtn.addEventListener("click", async () => {
      const res = await fetch("/api/cookie", { method: "DELETE" });
      renderCookieStatus(await res.json());
    });

    function createLinkRow(initialUrl = "") {
      rowSeq += 1;
      const id = `row-${rowSeq}`;
      const el = document.createElement("div");
      el.className = "link-item";
      el.innerHTML = `
        <div class="row">
          <span class="idx-badge">#</span>
          <input type="text" class="grow url-input" placeholder="Dán link YouTube vào đây (https://www.youtube.com/watch?v=...)" />
          <button type="button" class="btn-icon btn-row-plus" title="Thêm ô mới">+</button>
          <button type="button" class="btn-icon btn-row-remove" title="Xóa ô này">✕</button>
        </div>
        <div class="progress-wrap">
          <div class="progress-track">
            <div class="progress-fill"></div>
          </div>
          <span class="progress-pct">0%</span>
          <span class="progress-status">Sẵn sàng</span>
        </div>
      `;

      const input = el.querySelector(".url-input");
      const plusBtn = el.querySelector(".btn-row-plus");
      const removeBtn = el.querySelector(".btn-row-remove");
      const fill = el.querySelector(".progress-fill");
      const pct = el.querySelector(".progress-pct");
      const status = el.querySelector(".progress-status");

      input.value = initialUrl;

      const rowObj = { id, el, input, plusBtn, removeBtn, fill, pct, status };

      input.addEventListener("input", () => {
        if (isRunning) return;
        fill.style.width = "0%";
        fill.className = "progress-fill";
        pct.textContent = "0%";
        status.textContent = "Sẵn sàng";
        status.className = "progress-status";
        status.title = "";
      });

      plusBtn.addEventListener("click", () => {
        if (!isRunning) createLinkRow();
      });

      removeBtn.addEventListener("click", () => {
        if (isRunning) return;
        if (rows.length <= 1) {
          input.value = "";
          input.dispatchEvent(new Event("input"));
          return;
        }
        rows = rows.filter((r) => r.id !== id);
        el.remove();
        renumberRows();
      });

      rows.push(rowObj);
      linksList.appendChild(el);
      renumberRows();
      setRunningUI(isRunning);
      input.focus();
    }

    function renumberRows() {
      rows.forEach((r, idx) => {
        r.el.querySelector(".idx-badge").textContent = `#${idx + 1}`;
      });
    }

    function setRunningUI(running) {
      isRunning = running;
      startBtn.disabled = running;
      stopBtn.disabled = !running;
      if (!running) stopBtn.textContent = "Dừng";
      chooseCookieBtn.disabled = running;
      addRowBtn.disabled = running;
      modeRadios.forEach((r) => (r.disabled = running));
      rows.forEach((r) => {
        r.input.readOnly = running;
        r.plusBtn.disabled = running;
        r.removeBtn.disabled = running;
      });
      syncOptionControls();
      fetchCookieStatus().catch(() => {});
    }

    function applyStatusSnapshot(snap) {
      summaryText.textContent = snap.summary || "Sẵn sàng";
      const byId = new Map((snap.items || []).map((item) => [item.id, item]));
      rows.forEach((r) => {
        const item = byId.get(r.id);
        if (!item) return;
        const p = Math.max(0, Math.min(100, item.percent || 0));
        r.fill.style.width = `${p}%`;
        r.pct.textContent = `${p}%`;
        r.status.textContent = item.status || "";
        r.status.title = item.status || "";

        r.fill.className = "progress-fill";
        r.status.className = "progress-status";
        if (item.state === "done") {
          r.fill.classList.add("done");
          r.status.classList.add("status-ok");
        } else if (item.state === "cancelled") {
          r.fill.classList.add("cancelled");
          r.status.classList.add("status-warn");
        } else if (item.state === "error") {
          r.fill.classList.add("error");
          r.status.classList.add("status-err");
        }
      });

      if (isRunning && !snap.running) {
        stopPolling();
        setRunningUI(false);
        refreshDownloads();
      }
    }

    function startPolling() {
      stopPolling();
      pollTimer = setInterval(async () => {
        try {
          const res = await fetch("/api/status");
          if (res.ok) applyStatusSnapshot(await res.json());
        } catch (_) {}
      }, 350);
    }

    function stopPolling() {
      if (pollTimer) {
        clearInterval(pollTimer);
        pollTimer = null;
      }
    }

    addRowBtn.addEventListener("click", () => {
      if (!isRunning) createLinkRow();
    });

    startBtn.addEventListener("click", async () => {
      const items = rows
        .map((r) => ({ id: r.id, url: r.input.value.trim() }))
        .filter((item) => item.url.length > 0);

      if (items.length === 0) {
        alert("Hãy nhập ít nhất 1 link YouTube.");
        return;
      }

      const mode = document.querySelector('input[name="mode"]:checked').value;
      const payload = {
        items,
        mode,
        bitrate: bitrateSelect.value,
        quality: qualitySelect.value,
        embed_thumbnail: thumbCheckbox.checked,
      };

      const res = await fetch("/api/start", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload),
      });
      const data = await res.json();
      if (!res.ok) {
        alert(data.detail || "Không thể bắt đầu tải.");
        return;
      }

      setRunningUI(true);
      applyStatusSnapshot(data);
      startPolling();
    });

    stopBtn.addEventListener("click", async () => {
      stopBtn.disabled = true;
      stopBtn.textContent = "Đang dừng...";
      await fetch("/api/stop", { method: "POST" });
    });

    function formatSize(bytes) {
      if (bytes < 1024 * 1024) return `${(bytes / 1024).toFixed(1)} KB`;
      return `${(bytes / (1024 * 1024)).toFixed(1)} MB`;
    }

    async function refreshDownloads() {
      try {
        const res = await fetch("/api/downloads");
        if (!res.ok) return;
        const data = await res.json();
        const files = data.files || [];
        if (files.length === 0) {
          filesList.innerHTML = '<li style="color:var(--muted);">Chưa có file nào.</li>';
          return;
        }
        filesList.innerHTML = "";
        files.forEach((f) => {
          const li = document.createElement("li");
          const link = document.createElement("a");
          link.href = `/api/downloads/${encodeURIComponent(f.name)}`;
          link.textContent = f.name;
          const size = document.createElement("span");
          size.className = "file-size";
          size.textContent = formatSize(f.size);
          li.appendChild(link);
          li.appendChild(size);
          filesList.appendChild(li);
        });
      } catch (_) {}
    }

    refreshFilesBtn.addEventListener("click", refreshDownloads);

    // Initialize UI
    createLinkRow();
    fetchCookieStatus();
    refreshDownloads();
  </script>
</body>
</html>
